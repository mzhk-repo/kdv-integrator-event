services:
  kdv-api:
    container_name: !reset null
    restart: !reset null
    pull_policy: !reset null
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -a
        . /run/secrets/app_env_payload
        set +a
        export INTEGRATOR_MOUNT_PATH=/mnt/drive
        exec /app/scripts/entrypoint.sh "$$@"
      - --
    env_file: !reset []
    environment: []
    command:
      - /app/src/wait_for_drive.sh
      - gunicorn
      - -w
      - "1"
      - --threads
      - "4"
      - -b
      - 0.0.0.0:5000
      - src.app:app
    secrets:
      - source: app_env_payload
        target: app_env_payload
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 2m
      placement:
        constraints:
          - node.labels.app_zone == manager
    volumes:
      - ${ENTRYPOINT_SCRYPT_PATH}:/app/scripts/entrypoint.sh:ro

secrets:
  app_env_payload:
    external: true
    name: ${KDV_APP_ENV_PAYLOAD_SECRET_NAME}

services:
  kdv-api:
    container_name: !reset null
    restart: !reset null
    pull_policy: !reset null
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -a
        . /run/secrets/app_env_payload
        set +a
        export INTEGRATOR_MOUNT_PATH=/mnt/drive
        exec /app/scripts/entrypoint.sh "$$@"
      - --
    env_file: !reset []
    environment: []
    command:
      - /app/src/wait_for_drive.sh
      - gunicorn
      - -w
      - "1"
      - --threads
      - "4"
      - -b
      - 0.0.0.0:5000
      - src.app:app
    secrets:
      - source: app_env_payload
        target: app_env_payload
      - source: gdrive_service_account_json
        target: gdrive_service_account_json
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 2m
      placement:
        constraints:
          - node.labels.app_zone == manager
    volumes:
      - kdv-drive:/mnt/drive
      - kdv_optimize_data:/data/kdv_optimize
      - type: bind
        source: ${EXPORT_STATE_HOST_PATH:-/srv/kdv-integrator/export-state}
        target: /data/kdv_export_state
      - ${ENTRYPOINT_SCRYPT_PATH:-./scripts/entrypoint.sh}:/app/scripts/entrypoint.sh:ro

  kdv-optimizer:
    container_name: !reset null
    restart: !reset null
    pull_policy: !reset null
    env_file: !reset []
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 2m
      placement:
        constraints:
          - node.labels.app_zone == manager
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  kdv-drive:
    driver: rclone
    driver_opts:
      remote: "${RCLONE_REMOTE_NAME:?RCLONE_REMOTE_NAME is required}:"
      allow_other: "true"
      vfs_cache_mode: full
      poll_interval: "0"
  kdv_optimize_data:
    driver: local

secrets:
  app_env_payload:
    external: true
    name: ${KDV_APP_ENV_PAYLOAD_SECRET_NAME}
  gdrive_service_account_json:
    external: true
    name: ${GDRIVE_SERVICE_ACCOUNT_SECRET_NAME}

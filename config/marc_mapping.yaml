version: 1
columns:
  - name: "ID Запису"
    sources:
      - field: "001"

  - name: "title"
    sources:
      - field: "245"
        subfields: ["a", "b"]
        join: " "
        strip_chars: " /:"

  - name: "publication_date"
    sources:
      - field: "264"
        subfields: ["c"]
      - field: "260"
        subfields: ["c"]
    transform: "extract_year_regex"

  - name: "literature_type"
    sources:
      - field: "993"
        subfields: ["a"]
        transform: "authorized_value"
        dictionary: "itemtypes"

  - name: "url"
    sources:
      - field: "856"
        subfields: ["u"]
        condition:
          subfield: "y"
          equals: "Файл"

static_columns:
  - name: "Бібліотека-отримувач"
    value: "REDACTED_LIBRARY_NAME"
    reason: "Потрібно для імпорту в іншу бібліотеку, MARC-джерела поки немає"

  - name: "Статус імпорту"
    value: "Нові"
    reason: "Фіксоване значення для downstream import"

required_columns:
  - "title"
  - "literature_type"
  - "url"

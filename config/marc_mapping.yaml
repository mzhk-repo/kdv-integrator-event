version: 1
columns:
  - name: "ID Запису"
    sources:
      - field: "001"

  - name: "title"
    sources:
      - field: "245"
        subfields: ["a", "b"]
        join: " "
        strip_chars: " /:"

  - name: "literature_type"
    sources:
      - field: "993"
        subfields: ["a"]
        transform: "authorized_value"
        dictionary: "itemtypes"

static_columns:
  - name: "Бібліотека-отримувач"
    value: "REDACTED_LIBRARY_NAME"
    reason: "Потрібно для імпорту в іншу бібліотеку, MARC-джерела поки немає"

  - name: "Статус імпорту"
    value: "Нові"
    reason: "Фіксоване значення для downstream import"

required_columns:
  - "ID Запису"
  - "title"
  - "literature_type"
  - "Бібліотека-отримувач"

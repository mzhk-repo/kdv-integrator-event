name: App Pipeline

on:
  push:
    branches: [ dev, main ]
    paths-ignore:
      - '**/*.md'
      - '.env.example'
      - '.gitignore'
  pull_request:
    branches: [ dev, main ]
    paths-ignore:
      - '**/*.md'
      - '.env.example'
      - '.gitignore'
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  deploy-change-check:
    runs-on: ubuntu-latest
    outputs:
      deploy_allowed: ${{ steps.check.outputs.deploy_allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed_files=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi

          if printf '%s\n' "$changed_files" | grep -Fxq -e 'config/export_dictionaries.yaml' -e 'config/marc_mapping.yaml'; then
            echo 'deploy_allowed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy_allowed=true' >> "$GITHUB_OUTPUT"
          fi

  deploy-dev:
    needs: deploy-change-check
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    uses: mzhk-repo/shared-workflows/.github/workflows/shared-ci-cd.yml@main
    with:
      environment_name: development
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.deploy-change-check.outputs.deploy_allowed == 'true' }}
      use_ansible: true
      build_and_push_docker: false
      docker_image_name: kdv-integrator-event
      orchestration_script_path: 'scripts/deploy-orchestrator-swarm.sh'
      infra_repo_path: '/opt/Ansible'
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_HOST_KEY_PUB: ${{ secrets.SSH_HOST_KEY_PUB }}
      DEPLOY_PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  deploy-prod:
    needs: deploy-change-check
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    uses: mzhk-repo/shared-workflows/.github/workflows/shared-ci-cd.yml@main
    with:
      environment_name: production
      deploy: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && needs.deploy-change-check.outputs.deploy_allowed == 'true' }}
      use_ansible: true
      build_and_push_docker: false
      docker_image_name: kdv-integrator-event
      orchestration_script_path: 'scripts/deploy-orchestrator-swarm.sh'
      infra_repo_path: '/opt/Ansible'
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_HOST_KEY_PUB: ${{ secrets.SSH_HOST_KEY_PUB }}
      DEPLOY_PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

services:
  kdv-api:
    image: ${KDV_IMAGE:-${KDV_IMAGE_REPOSITORY:-ghcr.io/pinokew/kdv-integrator-event}:${KDV_IMAGE_VERSION:-latest}}
    container_name: kdv-api
    restart: unless-stopped
    privileged: true
    
    # 🟢 1. Запуск Production сервера (Gunicorn) на порту 5000
    command: /bin/sh /app/src/wait_for_drive.sh gunicorn -w 1 --threads 4 -b 0.0.0.0:5000 src.app:app
    
    env_file:
      - path: .env
        required: false
      
    environment:
      - TZ=Europe/Kyiv
      - INTEGRATOR_MOUNT_PATH=/mnt/drive
      - OPTIMIZER_URL=${OPTIMIZER_URL:-http://kdv-optimizer:5001}
      - OPTIMIZER_TIMEOUT=${OPTIMIZER_TIMEOUT:-130}
    volumes:
      # 🟢 2. Обов'язково монтуємо rclone volume, інакше скрипт не знайде PDF файли
      - kdv-drive:/mnt/drive
      - kdv_optimize_data:/data/kdv_optimize
      - type: bind
        source: ${EXPORT_STATE_HOST_PATH:-/srv/kdv-integrator/export-state}
        target: /data/kdv_export_state
      - type: bind
        source: ${EXPORT_CONFIG_HOST_PATH:-./config}
        target: /app/config
        read_only: true
      
    networks:
      - proxy-net

    deploy:
      labels:
        - "traefik.enable=true"
        # Хост залишив твій
        - "traefik.http.routers.kdv-api.rule=Host(`${HOST}`) && PathPrefix(`${PATH_PREFIX}`)"
        - "traefik.http.routers.kdv-api.priority=100"
        - "traefik.http.routers.kdv-api.entrypoints=web"

        # 🟢 3. Порт змінено на 5000 (стандарт Flask/Gunicorn)
        - "traefik.http.services.kdv-api.loadbalancer.server.port=5000"

        - "traefik.swarm.network=${EXTERNAL_NETWORK}"
      
  kdv-optimizer:
    image: ${KDV_OPTIMIZER_IMAGE:-${KDV_OPTIMIZER_IMAGE_REPOSITORY:-ghcr.io/OWNER/kdv-optimizer}:${KDV_OPTIMIZER_VERSION:-latest}}
    container_name: kdv-optimizer
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Europe/Kyiv
      - OPTIMIZER_PORT=${OPTIMIZER_PORT:-5001}
      - DATA_DIR=${DATA_DIR:-/data/kdv_optimize}
      - INPUT_DIR=${INPUT_DIR:-/data/kdv_optimize/input}
      - OUTPUT_DIR=${OUTPUT_DIR:-/data/kdv_optimize/output}
      - GS_TIMEOUT=${GS_TIMEOUT:-120}
      - QPDF_ENABLED=${QPDF_ENABLED:-false}
      - TMP_TTL_SECONDS=${TMP_TTL_SECONDS:-86400}
      - TTL_CHECK_INTERVAL_SECONDS=${TTL_CHECK_INTERVAL_SECONDS:-3600}
    volumes:
      - kdv_optimize_data:/data/kdv_optimize
    networks:
      - proxy-net
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  proxy-net:
    external: true
    name: ${EXTERNAL_NETWORK}

volumes:
  kdv-drive:
    driver: rclone
    driver_opts:
      remote: "${RCLONE_REMOTE_NAME:?RCLONE_REMOTE_NAME is required}:"
      allow_other: "true"
      vfs_cache_mode: full
      poll_interval: "0"
  kdv_optimize_data:
    driver: local
